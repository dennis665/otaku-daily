{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}宅日常{% endblock %}</title>
  <meta name="theme-color" content="#14122b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="宅日常">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}{% if app_env == 'staging' %} is-staging{% endif %}">
  {% if app_env == "staging" %}<div class="env-banner">🧪 測試站：資料會不定期清空，請勿存放重要資料</div>{% endif %}
  {% block content %}{% endblock %}
  <script>
    // 註冊 service worker，讓網站可以「加入主畫面」安裝成 App
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
    // 送出表單後停用按鈕，避免連按兩次造成「頁面已過期」
    document.addEventListener('submit', (e) => {
      e.target.querySelectorAll('button[type=submit]').forEach((btn) => {
        btn.disabled = true;
        if (btn.dataset.busy) btn.textContent = btn.dataset.busy;
      });
    });
    // 從返回鍵或切回 App 顯示快取頁面時重新載入，確保表單是最新的
    window.addEventListener('pageshow', (e) => {
      if (e.persisted && document.querySelector('form input[name=csrfmiddlewaretoken]')) location.reload();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
