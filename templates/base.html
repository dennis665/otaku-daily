{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}宅日常{% endblock %}</title>
  <meta name="theme-color" content="#14122b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="宅日常">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}{% if app_env == 'staging' %} is-staging{% endif %}">
  {% if app_env == "staging" %}<div class="env-banner">🧪 測試站：資料會不定期清空，請勿存放重要資料</div>{% endif %}
  {% block content %}{% endblock %}
  <script>
    // 註冊 service worker，讓網站可以「加入主畫面」安裝成 App
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
