{% extends "base.html" %}
{% block title %}註冊｜宅日常{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<main class="auth-card">
  <div class="brand"><span class="logo">♪</span><h1>建立帳號</h1><p>註冊後即可使用影音播放</p></div>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
    <button class="btn primary" type="submit">註冊並登入</button>
  </form>
  <p class="switch">已經有帳號了？<a href="{% url 'accounts:login' %}">登入</a></p>
</main>
{% endblock %}
