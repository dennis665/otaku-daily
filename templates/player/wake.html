{% load static %}<!doctype html>
{# 主機喚醒等待畫面：service worker 安裝時就存進手機，主機休眠時由 service worker 直接顯示（不經過伺服器）。 #}
{# 所以這頁不能用到伺服器上的其他檔案（除了同樣事先存好的影片），樣式與程式都寫在這裡。 #}
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1a">
<title>Ukiyo 喚醒中…</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a1a; color: #f2f0ff; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; overflow: hidden; }
  /* 封面圖墊在影片底下：影片還沒載入、或手機擋自動播放時也不會一片黑 */
  .poster { position: fixed; inset: 0; background: #0b0a1a url("{% static 'video/wake-poster.jpg' %}") center / cover no-repeat; }
  video, .as-img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
  .tap { position: fixed; left: 50%; top: 55%; transform: translate(-50%, -50%); display: none; padding: 12px 22px; border-radius: 99px;
    background: rgba(6, 5, 18, .7); border: 1px solid rgba(255, 255, 255, .35); color: #fff; font-weight: 700; }
  body.need-tap .tap { display: block; }
  /* 影片上方是純背景，狀態文字放在上面，不會擋到角色和名字 */
  .panel { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 18px) 20px 34px; text-align: center;
    background: linear-gradient(rgba(6, 5, 18, .85) 55%, transparent); }
  .title { font-size: 1.05rem; font-weight: 700; letter-spacing: .08em; margin: 0; }
  .title b { background: linear-gradient(135deg, #ff6fae, #9b7bff 55%, #5ee7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 6px 0 12px; font-size: .8rem; color: #a9a3d6; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; max-width: 320px; margin: 0 auto; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #ff6fae, #5ee7ff); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .dl { margin: 10px 0 0; font-size: .78rem; color: #5ee7ff; min-height: 1.2em; transition: opacity .6s; }
  .dl.fade { opacity: 0; }
  .preview { z-index: 50; position: fixed; bottom: calc(env(safe-area-inset-bottom) + 14px); left: 12px; right: 12px; display: none; justify-content: space-between; align-items: center; }
  .preview span { font-size: .8rem; font-weight: 700; color: #1a1300; background: #ffd34d; border-radius: 99px; padding: 6px 12px; }
  .preview a { color: #fff; background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .3); border-radius: 99px; padding: 10px 18px; text-decoration: none; font-size: .85rem; }
  body.is-preview .preview { display: flex; }
  /* 超過 3 分鐘還沒醒：切換成「伺服器維護中」 */
  .maint { display: none; }
  body.is-maint .wake { display: none; }
  body.is-maint .maint { display: block; }
  body.is-maint .retry { display: inline-block; }
  .retry { transition: transform .1s, background .2s; -webkit-tap-highlight-color: transparent; }
  .retry:active { transform: scale(.94); background: rgba(255, 255, 255, .25); }
  .retry:disabled { opacity: .75; cursor: default; }
  .retry .spin { display: inline-block; }
  .retry.busy .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result { margin: 8px 0 0; font-size: .8rem; color: #ffd38a; min-height: 1.2em; }
  body.is-maint .bar i { animation-duration: 3.2s; background: linear-gradient(90deg, #ffb35e, #ff6fae); }
  .retry { margin-top: 12px; padding: 9px 22px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .1); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="poster" aria-hidden="true"></div>
<video id="v" muted playsinline autoplay loop preload="auto" poster="{% static 'video/wake-poster.jpg' %}" aria-hidden="true"></video>
<div class="tap">👆 點一下畫面播放</div>
<div class="preview"><span>🎬 預覽模式（主機其實已醒著）</span><a href="/" onclick="event.preventDefault();location.replace('/')">✕ 返回</a></div>
<div class="panel" role="status" aria-live="polite">
  <p class="title wake"><b>Ukiyo</b> 主機喚醒中… <span id="sec">0</span> 秒</p>
  <p class="sub wake" id="hint">免費主機休息後要 30～60 秒才會醒來，醒了會自動進入</p>
  <p class="title maint"><b>Ukiyo</b> 🛠 伺服器維護中</p>
  <p class="sub maint">主機暫時無法啟動，請稍後再回來看看。<br>這個畫面會持續幫你檢查，恢復後自動進入。</p>
  <div class="bar"><i></i></div>
  <button class="retry maint" id="retry" type="button"><span class="spin">🔄</span> <span id="retry-text">重新檢查</span></button>
  <p class="result maint" id="result" aria-live="polite"></p>
  <p class="dl" id="dl"></p>
</div>
<script>
(() => {
  const VIDEO = '{% static "video/wake.mp4" %}';
  const preview = new URLSearchParams(location.search).has('preview');
  if (preview) document.body.classList.add('is-preview');
  const v = document.getElementById('v');

  v.muted = true;
  const dl = document.getElementById('dl');
  const say = (text, fadeLater) => {
    dl.textContent = text;
    dl.classList.remove('fade');
    if (fadeLater) setTimeout(() => dl.classList.add('fade'), 3000);
  };
  // 從網路串流時顯示已下載的百分比（依影片已緩衝到的長度計算）
  let done = false;
  function showProgress() {
    if (done || !v.duration || !isFinite(v.duration)) return;
    const b = v.buffered;
    const loaded = b.length ? b.end(b.length - 1) : 0;
    const pct = Math.min(100, Math.floor((loaded / v.duration) * 100));
    if (pct >= 99) { done = true; say('🎬 影片已下載完成', true); } else say(`🎬 影片下載中 ${pct}%（邊下載邊播放）`);
  }
  ['progress', 'loadedmetadata', 'canplaythrough', 'timeupdate'].forEach((ev) => v.addEventListener(ev, showProgress));
  // 影片一律用同一個網址：手機裡有存好，背景小程式會直接從手機提供（支援 iPhone 的分段讀取）；沒有就從網路串流
  const playIt = () => v.play().catch(() => {});
  v.src = VIDEO;
  v.load();
  playIt();
  // iPhone 有時會擋影片自動播放（例如省電模式、從主畫面開啟）：
  // 1.5 秒後還沒在播 → 改用 Safari 的「把 MP4 當圖片」方式（像 GIF 一樣靜音循環，不受自動播放限制）
  // 還是不行 → 顯示「點一下畫面播放」
  const tapPlay = () => { document.body.classList.remove('need-tap'); playIt(); };
  document.addEventListener('click', tapPlay);
  document.addEventListener('touchstart', tapPlay, { passive: true });
  v.addEventListener('playing', () => document.body.classList.remove('need-tap'));
  setTimeout(() => {
    if (!v.paused && v.currentTime > 0) return;   // 已經在播
    const img = new Image();
    img.className = 'as-img';
    img.alt = '';
    img.onload = () => { v.after(img); v.pause(); v.style.display = 'none'; };
    img.onerror = () => { if (v.paused) document.body.classList.add('need-tap'); };
    img.src = VIDEO;
  }, 1500);
  (async () => {
    let cached = null;
    try { cached = 'caches' in window ? await caches.match(VIDEO) : null; } catch { /* 忽略 */ }
    if (cached) { done = true; say('🎬 影片已存在手機', true); } else say('🎬 影片下載中 0%（邊下載邊播放）');
  })();

  // 超過 3 分鐘還沒醒（正常 30～60 秒）＝主機商那邊出狀況，改顯示「伺服器維護中」，檢查頻率放慢
  const MAINT_AFTER = 180;
  const start = Date.now();
  const secEl = document.getElementById('sec');
  const params = new URLSearchParams(location.search);
  let maint = params.get('preview') === 'maint';   // 預覽維護畫面：/wake/?preview=maint
  const showMaint = () => { maint = true; document.body.classList.add('is-maint'); document.title = 'Ukiyo 伺服器維護中'; };
  if (maint) showMaint();
  setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    secEl.textContent = s;
    if (s === 45) document.getElementById('hint').textContent = '快好了，再等一下下…';
    if (s === 90) document.getElementById('hint').textContent = '比平常久，可能是網路不穩，再等一下';
    if (s >= MAINT_AFTER && !maint) showMaint();
  }, 1000);
  // 問主機醒了沒；醒了就重新載入原本要開的頁面（預覽模式只回報結果、不跳轉）
  const awake = async () => {
    try {
      const r = await fetch('/version.json', { cache: 'no-store' });
      return r.ok && (r.headers.get('content-type') || '').includes('json');
    } catch { return false; }   // 還沒醒或沒網路
  };
  // 自動檢查：喚醒中每 2 秒、維護中每 15 秒
  let timer = null;
  async function poll() {
    clearTimeout(timer);
    if (await awake()) { location.reload(); return; }
    timer = setTimeout(poll, maint ? 15000 : 2000);
  }
  if (!preview) timer = setTimeout(poll, 1500);

  // 「重新檢查」：按下去轉圈、至少顯示 1 秒，再告訴使用者結果
  const retry = document.getElementById('retry');
  const retryText = document.getElementById('retry-text');
  const result = document.getElementById('result');
  retry.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (retry.disabled) return;
    retry.disabled = true;
    retry.classList.add('busy');
    retryText.textContent = '檢查中…';
    result.textContent = '';
    clearTimeout(timer);
    const [ok] = await Promise.all([awake(), new Promise((r) => setTimeout(r, 1000))]);
    retry.classList.remove('busy');
    retry.disabled = false;
    retryText.textContent = '重新檢查';
    const t = new Date();
    const hm = `${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}`;
    if (ok && !preview) { result.textContent = '✅ 主機恢復了，正在進入…'; location.reload(); return; }
    result.textContent = ok ? `✅ 主機正常（預覽模式不會跳轉）・${hm}` : `😢 還沒恢復（${hm} 檢查），之後每 15 秒會自動再檢查`;
    if (!preview) timer = setTimeout(poll, 15000);
  });
})();
</script>
</body>
</html>
