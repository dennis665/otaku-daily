{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  {# 3D 城市要全螢幕、不能被雙指縮放整個網頁（雙指是縮放鏡頭） #}
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a1d17">
  <title>夕陽山城｜Ukiyo</title>
  <link rel="icon" type="image/png" sizes="48x48" href="{% static 'icons/favicon-48.png' %}">
  <link rel="stylesheet" href="{% static 'city3d/city.css' %}">
  <style>
    /* 城市建造中（產生整座城市要 1～3 秒，手機較久） */
    #city-loading {
      position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; text-align: center;
      background: radial-gradient(circle at 50% 40%, #f6c48f, #b5674a 70%, #3a2219);
      color: #fff6eb; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    #city-loading b { display: block; font-size: 22px; letter-spacing: .08em; margin-bottom: 8px; }
    #city-loading small { opacity: .85; font-size: 13px; }
    #city-loading i { display: block; width: 46px; height: 46px; margin: 18px auto 0; border-radius: 50%;
      border: 4px solid rgba(255,246,235,.3); border-top-color: #fff6eb; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #city-error { display: none; }
  </style>
  <script>window.CITY_BACK_URL = "{% url 'player:home' %}?tab=works";</script>
</head>
<body>
  <div id="app"></div>
  <div id="city-loading" role="status">
    <div><b>🏙️ 夕陽山城</b><small>城市建造中…</small><i></i>
      <p id="city-error"><small>這台裝置的瀏覽器不支援 3D 繪圖（WebGL）。<br><a href="{% url 'player:home' %}?tab=works" style="color:#fff">← 回到 AI 創作</a></small></p>
    </div>
  </div>
  <script>
    // 不支援 WebGL 的瀏覽器：直接提示，不載入城市
    (function () {
      var ok = false;
      try { var c = document.createElement('canvas'); ok = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { ok = false; }
      if (!ok) {
        document.getElementById('city-error').style.display = 'block';
        document.querySelector('#city-loading i').style.display = 'none';
        window.CITY_NO_WEBGL = true;
      }
    })();
  </script>
  <script type="module">
    if (!window.CITY_NO_WEBGL) {
      await import("{% static 'city3d/city.js' %}");
      // 城市建好後的第一個畫面出來再拿掉建造中畫面
      const done = () => document.getElementById('city-loading')?.remove();
      requestAnimationFrame(() => requestAnimationFrame(done));
      setTimeout(done, 400);   // 分頁在背景時 requestAnimationFrame 不會跑，用計時器保底
    }
  </script>
</body>
</html>
