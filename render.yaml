# Render 部署設定：在 Render 選 New > Blueprint 並指定這個 GitHub 儲存庫，會自動建立網站與資料庫
services:
  # 正式站：部署 main 分支
  - type: web
    name: otaku-daily
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /accounts/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # 資料庫放在 Neon（免費且不會到期），連線網址含密碼，只在 Render 網頁的 Environment 手動填寫
      - key: DATABASE_URL
        sync: false

  # 測試站：部署 staging 分支，新功能先在這裡測試再合併到 main
  # 免費方案每個工作區只能有一個免費 PostgreSQL，測試站改用 SQLite，
  # 重新部署或休眠後資料會清空，所以每次啟動時才建立資料表
  - type: web
    name: otaku-daily-staging
    runtime: python
    plan: free
    region: singapore
    branch: staging
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --workers 1 --timeout 60
    healthCheckPath: /accounts/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: APP_ENV
        value: staging

databases:
  # 舊的 Render 免費 PostgreSQL（建立 30 天後到期），已改用 Neon；確認搬移完成後可移除這段並到 Render 刪除資料庫
  - name: otaku-daily-db
    plan: free
    region: singapore
    databaseName: otaku_daily
    user: otaku
