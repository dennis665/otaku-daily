# 推播提醒檢查：叫醒正式站並發送到期的行程提醒
# 台灣時間 08:00～22:00 每 30 分鐘一次（GitHub 排程用 UTC：台灣 08:00 = UTC 00:00）
# 只在這段時間執行，是為了節省 Render 免費主機（每月 750 小時）與 Neon 資料庫的免費額度
# 注意：GitHub 的排程在尖峰時段可能延遲幾分鐘到十幾分鐘
name: 推播提醒檢查

on:
  schedule:
    - cron: "0,30 0-13 * * *"   # 台灣 08:00～21:30
    - cron: "0 14 * * *"        # 台灣 22:00（當天最後一次，會先發出到隔天 08:00 前的提醒）
  workflow_dispatch:            # 也可以在 GitHub 的 Actions 頁面手動執行

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 叫醒正式站並檢查提醒
        # 免費主機休眠時第一次請求要等 30～60 秒喚醒，所以給足時間並重試
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 -X POST https://otaku-daily.onrender.com/notify/tick/
